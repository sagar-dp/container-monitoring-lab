global:
  scrape_interval: 10s       # How often Prometheus scrapes targets
  evaluation_interval: 10s   # How often rules are evaluated

scrape_configs:
  # Prometheus scraping itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Sample microservice application metrics
  - job_name: "sample-microservice"
    metrics_path: /metrics
    static_configs:
      - targets: ["microservice:5000"]

  # cAdvisor - container-level metrics (CPU, memory, network per container)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Node Exporter - host system-level metrics (CPU, memory, disk, network)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
